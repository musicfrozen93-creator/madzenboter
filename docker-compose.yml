version: '3.8'

# Zentry AI — backend stack.
#
#   Next.js frontend (separate deploy)
#        ↓ REST
#   analysis-api  ← this service: market data, technical analysis, signals
#        ↓
#   postgres      ← shared with the website (users, subscriptions, signals)
#
# The analysis service holds NO exchange credentials and cannot place an order.

services:
  postgres:
    image: postgres:16-alpine
    container_name: zengrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zengrid
      POSTGRES_USER: zengrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zengrid_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zengrid -d zengrid"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  analysis-api:
    build: .
    container_name: zentry-analysis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=UTC
      # No exchange API key exists anywhere in this stack — the analysis
      # service uses public market data only and never places an order.
      - DATABASE_URL=postgresql://zengrid:${POSTGRES_PASSWORD:-zengrid_dev_password}@postgres:5432/zengrid
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=${API_WORKERS:-2}
      # Optional: enables the forex market (read-only market data). Crypto works
      # without it. Leave blank to offer crypto only.
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY:-}
    # The container always listens on 8000. Other containers on the same Docker
    # network (e.g. a reverse proxy) reach it at http://zentry-analysis-api:8000
    # WITHOUT a host publish — this avoids the "port is already allocated"
    # conflict entirely.
    expose:
      - "8000"
    # HOST PUBLISH — the HOST-side port is configurable so a conflict on 8000 is
    # trivial to resolve (set ANALYSIS_HOST_PORT to a free port). PREFERRED
    # production setup: put this service behind your existing reverse proxy on
    # the shared Docker network and DELETE this `ports:` block so no host port is
    # published at all (see DEPLOYMENT.md).
    ports:
      - "${ANALYSIS_HOST_PORT:-8000}:8000"
    # Reverse-proxy deployments: uncomment and set to your proxy's network so the
    # proxy can route a public https://api.<domain> to this container internally.
    # networks:
    #   - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Uncomment to join an existing reverse-proxy network (name must match yours):
# networks:
#   proxy:
#     external: true

volumes:
  pgdata:
  logs:
